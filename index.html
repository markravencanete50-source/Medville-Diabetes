<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <!-- Vector tab icon: sharp at every size a browser draws it. The PNG is
         the touch icon for a phone home screen, which cannot use an SVG. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#00293B" />
    <title>Medville Diabetes | CGMs &amp; Diabetes Supplies Made Simpler</title>
    <meta name="description" content="Explore CGMs, insulin pumps, and diabetes supplies with support from Medville Diabetes. Check your potential CGM eligibility and learn what comes next." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

    <!--
      Link preview card, for WhatsApp, Messenger, Facebook, LinkedIn, Slack,
      iMessage and X. The picture is public/og-image.jpg: a render of this
      site's own home page hero, regenerated by scripts/build-og-image.mjs
      whenever the hero changes.

      These crawlers do not run JavaScript, so they never see the per-page
      titles React sets at runtime. They read this file and nothing else,
      which means every address on the site shares this one card. That is the
      intent: any link to the site previews as the home page hero.

      These addresses must be absolute, so they name the host serving the site
      directly. That is the Firebase host while www.medvillediabetes.com is
      still parked at the registrar: an og:image on a name that does not serve
      the file leaves a chat app with no picture and no card at all. When the
      custom domain is connected, the canonical link, og:url, og:image and
      twitter:image below all change with it, together with SITE_ORIGIN in
      src/data/pageMeta.ts and the sitemap line in public/robots.txt.
    -->
    <link rel="canonical" href="https://medville-diabetes.web.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Medville Diabetes" />
    <meta property="og:url" content="https://medville-diabetes.web.app/" />
    <meta property="og:title" content="Medville Diabetes | CGMs &amp; Diabetes Supplies Made Simpler" />
    <meta property="og:description" content="Explore CGMs, insulin pumps, and diabetes supplies with support from Medville Diabetes. Check your potential CGM eligibility and learn what comes next." />
    <meta property="og:image" content="https://medville-diabetes.web.app/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Medville Diabetes home page: Manage Less. Live More., beside a FreeStyle Libre 3 continuous glucose monitor." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Medville Diabetes | CGMs &amp; Diabetes Supplies Made Simpler" />
    <meta name="twitter:description" content="Explore CGMs, insulin pumps, and diabetes supplies with support from Medville Diabetes. Check your potential CGM eligibility and learn what comes next." />
    <meta name="twitter:image" content="https://medville-diabetes.web.app/og-image.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
