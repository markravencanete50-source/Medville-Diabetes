name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The dashboard and public forms call Cloud Run functions. Their
      # addresses are read at build time, so a build with these unset ships a
      # bundle with nowhere to send anything. Public API addresses are kept in
      # this workflow; credentials remain in repository secrets.
      #
      # Repository settings -> Secrets and variables -> Actions:
      #   VITE_ADMIN_API         the adminApi function URL
      #   VITE_CONTACT_ENDPOINT  the contactEnquiry function URL
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm test && npm run build
        env:
          VITE_ADMIN_API: ${{ secrets.VITE_ADMIN_API }}
          VITE_AWS_ADMIN_API: https://v7etel6u7f.execute-api.us-east-1.amazonaws.com/admin
          VITE_QUALIFY_ENDPOINT: https://v7etel6u7f.execute-api.us-east-1.amazonaws.com/intake
          VITE_ATTRIBUTION_ENDPOINT: ${{ secrets.VITE_ATTRIBUTION_ENDPOINT }}
          VITE_CONTACT_ENDPOINT: https://v7etel6u7f.execute-api.us-east-1.amazonaws.com/contact
          VITE_INTAKE_ENABLED: 'false'
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MEDVILLE_DIABETES }}
          projectId: medville-diabetes
