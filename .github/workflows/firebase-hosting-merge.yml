name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
  workflow_dispatch:

# Serialise deploys to the live channel. Runs are NOT cancelled in flight:
# GitHub orders runs by start time, not by commit recency, so a delayed push
# event for an older commit can start after a newer deploy and would cancel
# it. Queueing instead is safe because the checkout below always takes the
# tip of main, so whichever run goes last still publishes current content.
concurrency:
  group: firebase-hosting-live
  cancel-in-progress: false
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      # Always deploy the tip of main rather than the commit that triggered
      # this run. A run stranded in the queue then publishes current content
      # instead of resurrecting whatever main looked like an hour ago, which
      # is how run 13 rolled the live site back on 2026-08-26.
      - uses: actions/checkout@v4
        with:
          ref: main
      # The dashboard and the qualify form call two Cloud Run functions. Their
      # addresses are read at build time, so a build with these unset ships a
      # bundle with nowhere to send anything, and the dashboard's Enquiries
      # screen fails with no way to tell why. They are addresses, not secrets,
      # but they live in repository settings because they differ per
      # environment and are not known until the functions are deployed.
      # An unset secret is an empty string, which the app already treats as
      # "not configured" and says so on screen.
      #
      # Repository settings -> Secrets and variables -> Actions:
      #   VITE_ADMIN_API         the adminApi function URL
      #   VITE_QUALIFY_ENDPOINT  the qualifyIntake function URL
      - run: npm ci && npm run build
        env:
          VITE_ADMIN_API: ${{ secrets.VITE_ADMIN_API }}
          VITE_QUALIFY_ENDPOINT: ${{ secrets.VITE_QUALIFY_ENDPOINT }}
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MEDVILLE_DIABETES }}
          channelId: live
          projectId: medville-diabetes
