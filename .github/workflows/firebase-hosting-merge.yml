name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
  workflow_dispatch:

# Only the newest deploy may reach the live channel. A run that has been
# sitting in the queue (GitHub's 2026-08-26 Actions incident left several
# stranded for an hour) would otherwise publish its stale commit over a
# newer one, which is exactly what happened to run 13. Grouping every run
# here means a newer run supersedes any older run still pending.
concurrency:
  group: firebase-hosting-live
  cancel-in-progress: true
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci && npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MEDVILLE_DIABETES }}
          channelId: live
          projectId: medville-diabetes
