name: API and Firestore security tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  security_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm test
      - run: npx -y firebase-tools@15.29.0 emulators:exec --only firestore --project demo-medville-test --config firebase.test.json "npm run test:rules"
