AWSTemplateFormatVersion: "2010-09-09"
Description: Medville Diabetes HIPAA intake and lead administration

Parameters:
  AllowedOrigins:
    Type: CommaDelimitedList
    Default: https://www.medvillediabetes.com,https://medvillediabetes.com,https://medville-diabetes.web.app
  FirebaseProjectId:
    Type: String
    Default: medville-diabetes
  IntakeEnabled:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
  SenderEmail:
    Type: String
    Default: info@medvillediabetes.com
  SenderDomain:
    Type: String
    Default: medvillediabetes.com

Resources:
  SenderEmailIdentity:
    Type: AWS::SES::EmailIdentity
    Properties:
      EmailIdentity: !Ref SenderDomain

  PhiKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: Encrypts Medville eligibility and access records
      EnableKeyRotation: true
      PendingWindowInDays: 30
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: RootAdministration
            Effect: Allow
            Principal:
              AWS: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:root
            Action: kms:*
            Resource: "*"

  PhiKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: alias/medville-phi
      TargetKeyId: !Ref PhiKey

  LeadsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: medville-phi-leads
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: !GetAtt PhiKey.Arn
      TimeToLiveSpecification:
        AttributeName: purgeAt
        Enabled: true
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: gsi1pk
          AttributeType: S
        - AttributeName: gsi1sk
          AttributeType: S
        - AttributeName: assignedTo
          AttributeType: S
        - AttributeName: workSk
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: LeadTimeline
          KeySchema:
            - AttributeName: gsi1pk
              KeyType: HASH
            - AttributeName: gsi1sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        # Sparse: only assigned leads appear, so a salesperson's list is read
        # directly rather than filtered out of every lead. workSk is "open#" or
        # "done#" then the arrival time, so the alert job reads open leads only.
        - IndexName: AssigneeTimeline
          KeySchema:
            - AttributeName: assignedTo
              KeyType: HASH
            - AttributeName: workSk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  AuditTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: medville-phi-audit
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: !GetAtt PhiKey.Arn
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: gsi1pk
          AttributeType: S
        - AttributeName: gsi1sk
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: AuditTimeline
          KeySchema:
            - AttributeName: gsi1pk
              KeyType: HASH
            - AttributeName: gsi1sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # One lead's history: stage changes, assignments, calls and note edits, with who and
  # when. It names leads and stages, so it is protected like the lead and audit tables.
  HistoryTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: medville-phi-lead-history
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: !GetAtt PhiKey.Arn
      AttributeDefinitions:
        - AttributeName: leadId
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: leadId
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE

  RateTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: medville-intake-limits
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: !GetAtt PhiKey.Arn
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  # Staff alert settings: workforce email addresses and on/off state, no patient data.
  AlertsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: medville-staff-alerts
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: !GetAtt PhiKey.Arn
      AttributeDefinitions:
        - AttributeName: uid
          AttributeType: S
      KeySchema:
        - AttributeName: uid
          KeyType: HASH

  LambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: medville-phi-api-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: medville-phi-table-access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:Query
                  - dynamodb:TransactWriteItems
                Resource:
                  - !GetAtt LeadsTable.Arn
                  - !Sub ${LeadsTable.Arn}/index/*
                  - !GetAtt AuditTable.Arn
                  - !Sub ${AuditTable.Arn}/index/*
                  - !GetAtt HistoryTable.Arn
              # The hourly limit on releasing phone numbers for calls.
              - Effect: Allow
                Action: dynamodb:UpdateItem
                Resource: !GetAtt RateTable.Arn
              - Effect: Allow
                Action: [dynamodb:Scan, dynamodb:UpdateItem]
                Resource: !GetAtt AlertsTable.Arn
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:Encrypt
                  - kms:GenerateDataKey
                Resource: !GetAtt PhiKey.Arn
              - Effect: Allow
                Action: ses:SendEmail
                Resource: "*"
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/medville-phi-*:*

  IntakeRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: medville-intake-only
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem]
                Resource: !GetAtt LeadsTable.Arn
              - Effect: Allow
                Action: [dynamodb:UpdateItem]
                Resource: !GetAtt RateTable.Arn
              - Effect: Allow
                Action: [kms:Decrypt, kms:Encrypt, kms:GenerateDataKey]
                Resource: !GetAtt PhiKey.Arn
              - Effect: Allow
                Action: ses:SendEmail
                Resource: "*"
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/medville-phi-intake:*

  IntakeFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: medville-phi-intake
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt IntakeRole.Arn
      Timeout: 15
      MemorySize: 256
      KmsKeyArn: !GetAtt PhiKey.Arn
      LoggingConfig:
        ApplicationLogLevel: ERROR
        SystemLogLevel: WARN
        LogFormat: JSON
      Environment:
        Variables:
          ALLOWED_ORIGINS: !Join [",", !Ref AllowedOrigins]
          INTAKE_ENABLED: !Ref IntakeEnabled
          LEADS_TABLE: !Ref LeadsTable
          RATE_TABLE: !Ref RateTable
          INTAKE_CONFIG_URL: https://us-central1-medville-diabetes.cloudfunctions.net/intakeConfig
          SENDER_EMAIL: !Ref SenderEmail
      Code:
