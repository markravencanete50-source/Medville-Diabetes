<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!--
    Medville Diabetes tab icon.

    The "M" is the exact path from the client's logo
    (brand/MD_Logo_Transparent.svg), in the logo's own navy on a white tile.

    Two reasons it is the letter and not the whole lockup. A browser draws a
    favicon at 16 or 32 pixels, and the wordmark is 2.2 times wider than it is
    tall, so fitting it into a square left the type about seven pixels high and
    unreadable. And the wordmark is navy, which disappeared against a dark
    browser tab bar until it was given a light field of its own.
  -->
  <rect width="64" height="64" rx="14" fill="#ffffff"/>
  <path transform="translate(-2.991 -74.138) scale(0.620690)" fill="#002a3b" d="M92.12,199.87h-14.2c-.11-1.18-1.4-12.72-3.87-34.63-.22-2.24-.34-4.59-.34-7.06h-.17c-.28,1.12-.98,3.47-2.1,7.06l-12.44,34.63h-7.23c-.56-1.4-4.68-12.94-12.35-34.63-.84-2.3-1.51-4.65-2.02-7.06l-.17.08c.06,2.35-.06,4.68-.34,6.98l-3.95,34.63h-12.27l7.65-57.82h14.37l11.43,33.53c.73,2.19,1.34,4.37,1.85,6.56h.17c.22-1.01.87-3.17,1.93-6.47l12.02-33.62h14.29l7.73,57.82Z"/>
</svg>
