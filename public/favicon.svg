<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!--
  Medville Diabetes tab icon.

  The "M" is the exact path from the client's logo
  (brand/MD_Logo_Transparent.svg), reversed to white on the brand cyan. A
  browser draws a favicon at 16 or 32 pixels, where the full wordmark is an
  unreadable smudge, so the tile carries the letter instead. The cyan field
  also keeps the mark legible against both light and dark browser chrome,
  which a transparent icon would not.
  -->
