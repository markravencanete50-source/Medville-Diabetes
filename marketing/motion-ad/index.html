<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, initial-scale=1">
<title>Medville Diabetes Motion Ad</title>
<!--
  The Medville Diabetes motion advertisement, 1920 x 1080.

  Every frame is drawn by window.render(t), where t is the time in seconds.
  Nothing here uses CSS animation or timers, so the same t always gives the
  same picture. render.cjs steps t frame by frame and pipes the screenshots
  into ffmpeg. Opening this page in a browser without ?render plays it live.

  Palette: navy #00293B, cyan #18BADA and white, with the site's tints.
  Fonts: Poppins for display type, Inter for body type, both stored locally.
-->
<style>
@font-face{font-family:'Poppins';font-weight:400;src:url(fonts/poppins-400.woff2) format('woff2');}
@font-face{font-family:'Poppins';font-weight:500;src:url(fonts/poppins-500.woff2) format('woff2');}
@font-face{font-family:'Poppins';font-weight:600;src:url(fonts/poppins-600.woff2) format('woff2');}
@font-face{font-family:'Poppins';font-weight:700;src:url(fonts/poppins-700.woff2) format('woff2');}
@font-face{font-family:'Poppins';font-weight:800;src:url(fonts/poppins-800.woff2) format('woff2');}
@font-face{font-family:'Inter';font-weight:100 900;src:url(fonts/inter-var.woff2) format('woff2');}

:root{
  --navy:#00293b; --abyss:#001824; --raised:#0b3a52;
  --cyan:#18bada; --cyan-deep:#0a6d8a; --teal:#0d99bb;
  --canvas:#e6f4f9; --surface:#f3fafc; --soft:#cdeaf3;
  --ink-muted:#3d6273; --ink-dark:#1d4a5e;
  --on-dark-brand:#c5e3ee; --on-dark-muted:#a3c6d4; --on-dark-accent:#6fc4e0;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--abyss)}
body{font-family:'Inter',sans-serif;text-wrap:balance;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;perspective:2400px;background:var(--abyss)}
.scene{position:absolute;inset:0;overflow:hidden;display:none;backface-visibility:hidden;transform-origin:50% 50%}
.bg,.fx,.hud{position:absolute;inset:0}
.cam{position:absolute;inset:0;perspective:1500px;perspective-origin:50% 50%}
.world{position:absolute;inset:0;transform-style:preserve-3d;transform-origin:50% 50%}
.abs{position:absolute}
.p3d{transform-style:preserve-3d}
.w{display:inline-block;will-change:transform,opacity}
.disp{font-family:'Poppins',sans-serif}
.eyebrow{font-family:'Inter';font-weight:600;font-size:22px;letter-spacing:.2em;text-transform:uppercase}
.ic{display:block;overflow:visible}
.blob{position:absolute;border-radius:50%;filter:blur(60px)}
.tc{text-align:center}
#vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 75% 70% at 50% 50%,transparent 60%,rgba(0,24,36,.22) 100%)}
#ring-burst{position:absolute;left:0;top:0;border-radius:50%;border:3px solid var(--cyan);pointer-events:none;display:none}
#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font:600 28px Poppins}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <filter id="mb2" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="0 0"/></filter>
    <filter id="mb3" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="0 0"/></filter>
    <filter id="mb4" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="0 0"/></filter>
    <filter id="mb5" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="0 0"/></filter>
    <filter id="mb6" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="0 0"/></filter>
  </defs>
</svg>
<div id="stage"><div id="loading">Loading</div></div>
<script src="icons.js"></script>
<script src="ad.js"></script>
</body>
</html>
